<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Petty Tribunal</title>
  <link rel="icon" href="/shared/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/arcade.css">
  <style>
    :root {
      --mahogany: #3b1d14; --wood: #5a2e1e; --wood-2: #6e3a26; --leather: #1f4d3a; --brass: #d4a84b; --parch: #f2e6cc; --red: #b3261e;
      --jx-bg: var(--mahogany); --jx-accent: var(--brass); --jx-panel: #4a2419; --jx-line: #7a4631; --jx-dim: #d9bf9a; --jx-ink: var(--parch);
      --jx-sans: "Libre Caslon Text", Georgia, serif;
    }
    body { background: repeating-linear-gradient(90deg, #3b1d14 0 120px, #401f16 120px 124px, #37190f 124px 240px); }
    .wrap { max-width: 1080px; margin: 0 auto; padding: 22px 16px 60px; }
    .bench { text-align: center; padding: 26px 16px 8px; }
    .bench h1 { font: 400 clamp(44px, 8vw, 86px)/1 "Libre Caslon Display", serif; color: var(--brass); margin: 0; }
    .bench p { color: var(--jx-dim); max-width: 60ch; margin: 10px auto 0; font-style: italic; }
    .docket { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 28px; }
    .docket label { display: block; font-weight: 700; color: var(--brass); margin: 0 0 6px; }
    .docket textarea { width: 100%; min-height: 130px; background: var(--parch); color: #2a150d; border: 0; border-radius: 3px; padding: 14px; font: 17px/1.5 "Libre Caslon Text", serif; box-shadow: inset 0 0 0 1px #c9b590, 4px 4px 0 rgba(0,0,0,.35); resize: vertical; }
    .cases { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; justify-content: center; }
    .cases button { background: transparent; border: 1px solid var(--jx-line); color: var(--jx-dim); padding: 6px 12px; border-radius: 999px; font: italic 14px "Libre Caslon Text"; }
    .cases button:hover { border-color: var(--brass); color: var(--parch); }
    .gavel { display: block; margin: 22px auto 0; background: var(--brass); color: var(--mahogany); border: 0; padding: 14px 28px; font: 700 18px "Libre Caslon Text"; border-radius: 3px; box-shadow: 0 4px 0 #8a6a25; }
    .gavel:active { transform: translateY(3px); box-shadow: 0 1px 0 #8a6a25; }
    .gavel:disabled { opacity: .6; }
    .box { margin-top: 32px; background: linear-gradient(180deg, var(--wood-2), var(--wood)); border: 6px solid #2a130c; border-radius: 6px; padding: 20px; }
    .box h2 { margin: 0 0 14px; font: 400 26px "Libre Caslon Display"; color: var(--brass); text-align: center; }
    .jurors { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
    .juror { background: var(--leather); border-radius: 10px 10px 4px 4px; padding: 12px 8px; text-align: center; position: relative; min-height: 150px; transition: background .4s, transform .4s; }
    .juror .face { font-size: 34px; line-height: 1; }
    .juror b { display: block; font-size: 14px; margin-top: 6px; color: var(--parch); }
    .juror small { display: block; font-size: 11.5px; color: #b7d4c5; font-style: italic; line-height: 1.3; margin-top: 4px; }
    .juror .vote { position: absolute; left: 6px; right: 6px; bottom: 6px; font: 700 12px "Libre Caslon Text"; padding: 3px; border-radius: 3px; background: rgba(0,0,0,.25); color: var(--jx-dim); }
    .juror.guilty { background: #6b1f18; transform: translateY(-4px); }
    .juror.guilty .vote { background: var(--red); color: #fff; }
    .juror.innocent .vote { background: var(--parch); color: var(--leather); }
    .juror.torn .vote { background: var(--brass); color: var(--mahogany); }
    .verdict { margin-top: 24px; background: var(--parch); color: #2a150d; padding: 26px; border-radius: 3px; text-align: center; box-shadow: 6px 6px 0 rgba(0,0,0,.4); }
    .verdict h3 { font: 400 clamp(32px, 6vw, 56px)/1 "Libre Caslon Display"; margin: 0; color: var(--red); }
    .verdict h3.free { color: var(--leather); }
    .verdict p { margin: 12px auto 0; max-width: 58ch; }
    .verdict .tally { font-style: italic; color: #6e4a36; }
    .verdict .sentence { font-weight: 700; font-size: 20px; }
    @media (max-width: 820px) { .docket { grid-template-columns: 1fr; } .jurors { grid-template-columns: repeat(3, 1fr); } }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="bench">
      <h1>Petty Tribunal</h1>
      <p>The court of small wrongs is now in session. Twelve jurors, each with their own quirks, reach their verdicts at the same moment, because Jev hears all twelve questions in one call.</p>
    </header>
    <div class="docket">
      <div>
        <label for="charge">The charge</label>
        <textarea id="charge">My roommate ate the last slice of my birthday cake, which I had labeled with my name, a drawing of a skull, and the words "DO NOT". He left the empty plate in the fridge.</textarea>
      </div>
      <div>
        <label for="defense">The defense</label>
        <textarea id="defense">It was 3am, I had just finished a double shift, and I honestly thought the skull was a decoration. I bought a replacement cake the next day, and it was bigger.</textarea>
      </div>
    </div>
    <div class="cases" id="cases"></div>
    <button class="gavel" id="gavel">Hear the case</button>
    <section class="box">
      <h2>The jury</h2>
      <div class="jurors" id="jurors"></div>
    </section>
    <div id="verdict"></div>
  </div>
  <script type="module">
    import { ask, chrome, badge, escapeHtml } from "/shared/jev.js";
    chrome({ title: "Petty Tribunal", kind: "silly", accent: "#d4a84b" });

    const JURY = [
      { face: "👵", name: "Mildred", about: "retired schoolteacher, rules are rules", lens: "strictly follows written rules and labels; hates excuses" },
      { face: "🧑‍🎤", name: "Jax", about: "punk drummer, anti-authority", lens: "sides with the underdog and distrusts anyone who acts like the property police" },
      { face: "👨‍⚖️", name: "Harold", about: "ex-lawyer, obsessed with evidence", lens: "only convicts if the evidence clearly proves the act and intent" },
      { face: "🧘", name: "Sunny", about: "yoga instructor, forgives everything", lens: "believes in second chances and weighs any apology or restitution heavily" },
      { face: "🍳", name: "Rosa", about: "chef, food is sacred", lens: "treats any crime involving food with maximum seriousness" },
      { face: "🤓", name: "Devin", about: "software engineer, pedantic", lens: "focuses on precise definitions and technicalities in the charge" },
      { face: "🐈", name: "Mrs. Whiskers", about: "cat lady, deeply suspicious", lens: "assumes everyone is guilty of something" },
      { face: "💼", name: "Brad", about: "middle manager, wants this over", lens: "votes whichever way ends the meeting fastest, usually with the majority mood" },
      { face: "🎭", name: "Ophelia", about: "drama student, loves a tragedy", lens: "is moved by emotional stories and sympathetic circumstances" },
      { face: "🧓", name: "Gus", about: "farmer, common sense", lens: "asks whether a reasonable neighbor would be upset by this" },
      { face: "👩‍🔬", name: "Dr. Priya", about: "scientist, weighs intent", lens: "distinguishes carefully between malice, negligence, and honest mistakes" },
      { face: "🧒", name: "Timmy", about: "age 9, somehow on the jury", lens: "thinks about whether it's fair, like on the playground" },
    ];
    const SENTENCES = {
      apology_song: "must perform a sincere apology song in the kitchen",
      replace_double: "must replace the item twice over",
      chores: "must do the dishes for two weeks",
      label_maker: "is sentenced to buy the victim a label maker",
      public_shame: "must post a public apology in the group chat",
      banished: "is banished from the shared snack shelf for a month",
      community: "must organize a peace dinner for everyone involved",
      warning: "gets off with a stern, disappointed look",
    };
    const CASES = [
      ["Cake thief", "My roommate ate the last slice of my birthday cake, which I had labeled with my name, a drawing of a skull, and the words \"DO NOT\". He left the empty plate in the fridge.", "It was 3am, I had just finished a double shift, and I honestly thought the skull was a decoration. I bought a replacement cake the next day, and it was bigger."],
      ["Spoiler", "My coworker spoiled the finale of the show I've been watching for six years, loudly, in the break room, the morning after it aired.", "Honestly, it aired yesterday. If you care that much, you watch it live. Also, I didn't know you were standing behind me."],
      ["Reply-all", "My neighbor replied-all to the 400-person building email to say \"thanks!\" and then again to say \"sorry for the reply-all\".", "The first one was polite, the second one was polite. I'm being punished for manners."],
      ["Thermostat", "My partner keeps secretly lowering the thermostat to 17°C at night while I sleep.", "They sleep with three blankets and a hat. I am being slow-cooked. It's self-defense."],
      ["Recliner", "The passenger in front of me on a 10-hour flight reclined fully the moment the seatbelt sign turned off, during the meal service.", "The seat reclines. That's what the button does. I paid for this seat."],
    ];

    const $ = (id) => document.getElementById(id);
    $("cases").innerHTML = CASES.map(([label], i) => `<button data-i="${i}">${label}</button>`).join("");
    $("cases").onclick = (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      const [, c, d] = CASES[b.dataset.i];
      $("charge").value = c;
      $("defense").value = d;
    };

    function seat(votes = []) {
      $("jurors").innerHTML = JURY.map((j, i) => {
        const p = votes[i];
        const cls = p == null ? "" : p >= 0.6 ? "guilty" : p <= 0.4 ? "innocent" : "torn";
        const label = p == null ? "listening" : p >= 0.6 ? `guilty ${Math.round(p * 100)}%` : p <= 0.4 ? `not guilty ${Math.round((1 - p) * 100)}%` : `torn ${Math.round(p * 100)}%`;
        return `<div class="juror ${cls}"><div class="face">${j.face}</div><b>${j.name}</b><small>${j.about}</small><div class="vote">${label}</div></div>`;
      }).join("");
    }
    seat();

    $("gavel").onclick = async () => {
      const charge = $("charge").value.trim();
      const defense = $("defense").value.trim();
      if (!charge) return;
      $("gavel").disabled = true;
      $("verdict").innerHTML = "";
      seat();
      const questions = {};
      JURY.forEach((j, i) => {
        questions[`j${i}`] = {
          type: "noul",
          instructions: { juror: { name: j.name, who: j.about, how_they_judge: j.lens }, question: "Judging the way `juror` judges, is the defendant guilty of the `charge` after hearing the `defense`?" },
          criteria: { true: "guilty as charged", false: "not guilty" },
        };
      });
      questions.pettiness = { type: "score", instructions: "How petty is this dispute?", criteria: ["a genuinely serious matter", "a fair complaint", "pretty petty", "extremely petty", "the pettiest thing ever brought to court"] };
      questions.sentence = { type: "choice", instructions: "If the defendant is found guilty, which sentence best fits this particular offense?", criteria: SENTENCES };
      questions.remorse = { type: "noul", instructions: "Does the `defense` show real remorse or an attempt to make amends?" };
      try {
        const r = await ask({ charge, defense }, questions);
        const votes = JURY.map((_, i) => r.answers[`j${i}`].noul);
        for (let i = 0; i < JURY.length; i += 1) {
          await new Promise((res) => setTimeout(res, 140));
          seat(votes.slice(0, i + 1));
        }
        const guilty = votes.filter((v) => v >= 0.5).length;
        const petty = r.answers.pettiness;
        const pettyLabel = petty.legend[String(Math.round(petty.score))];
        let head, cls = "", body;
        if (guilty >= 9) {
          head = "GUILTY";
          body = `<p class="sentence">The defendant ${SENTENCES[r.answers.sentence.choice]}.</p>`;
        } else if (guilty <= 3) {
          head = "NOT GUILTY"; cls = "free";
          body = `<p>The defendant leaves without a stain on their character. Well, maybe a small one.</p>`;
        } else {
          head = "HUNG JURY"; cls = "free";
          body = `<p>Neither side reached the nine votes needed. The court suggests you both just talk to each other.</p>`;
        }
        $("verdict").innerHTML = `<div class="verdict"><h3 class="${cls}">${head}</h3>
          <p class="tally">${guilty} of 12 jurors voted guilty. The court rates this case <b>${escapeHtml(pettyLabel)}</b> (${petty.score.toFixed(2)} of 4). Remorse detected: ${Math.round(r.answers.remorse.noul * 100)}%.</p>
          ${body}<p style="margin-top:14px">${badge(r)}</p></div>`;
      } catch (err) {
        $("verdict").innerHTML = `<p class="jx-error">${escapeHtml(err.message)}</p>`;
      }
      $("gavel").disabled = false;
    };
  </script>
</body>
</html>
